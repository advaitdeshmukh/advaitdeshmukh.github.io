name: Update CV

# Keeps assets/pdf/CV.pdf in sync with the private CV submodule (cv-src).
# Bumps the submodule to its latest commit, compiles main.tex, and commits the
# resulting PDF — which triggers the normal "Deploy site" workflow.
#
# Fired by the CV repo's own "Notify website" workflow (see
# advaitdeshmukh/CV/.github/workflows/notify-website.yml) via a
# repository_dispatch call on every push to CV's main branch.
#
# The daily schedule is a safety net, not the primary trigger: between
# 2026-08-06 and 2026-11-13 the dispatch never fired once (every sync in
# that window was a manual workflow_dispatch), and nothing surfaced it.
# If the dispatch breaks again the CV is at most a day stale instead of
# silently frozen.

on:
  repository_dispatch:
    types: [cv-updated]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site with CV submodule 🛎️
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT with Contents: Read on advaitdeshmukh/CV and
          # Contents: Read and write on this repo. Stored as the CV_PAT secret.
          token: ${{ secrets.CV_PAT }}

      - name: Update CV submodule to latest ⬆️
        run: git submodule update --remote cv-src

      - name: Compile CV 📄
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv-src
          root_file: main.tex

      - name: Copy PDF into assets 📥
        run: |
          mkdir -p assets/pdf
          cp cv-src/main.pdf assets/pdf/CV.pdf

      - name: Commit if changed 💾
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv-src assets/pdf/CV.pdf
          if git diff --cached --quiet; then
            echo "CV is already up to date — nothing to commit."
          else
            git commit -m "Sync CV from source"
            git push
          fi
